name: CI

on:
  push:
    branches: [ main ]
    
  workflow_dispatch: # Enables manual runs from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name : Check out code
      - uses: actions/checkout@v3

      - name : Setup Python
      - uses : actions/setup-python@v5
        with:
          python-version: '3.11'
